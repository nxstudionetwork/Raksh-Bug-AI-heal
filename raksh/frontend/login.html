<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login to RAKSH - AI Security Guardian">
  <title>Login - RAKSH</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
</head>
<body>
  <a class="skip-link" href="#mainContent">Skip to main content</a>
  <div class="animated-bg">
    <div class="orb"></div>
    <div class="orb"></div>
    <div class="orb"></div>
  </div>

  <div class="login-page" id="mainContent">
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-logo">
          <div class="logo-text">🛡️ RAKSH</div>
        </div>
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Sign in to continue protecting your digital life</p>

        <form id="loginForm">
          <div class="form-group">
            <label class="form-label" for="loginEmail">Email Address</label>
            <input type="email" id="loginEmail" class="form-input" placeholder="your@email.com" required autocomplete="email">
          </div>
          <div class="form-group">
            <label class="form-label" for="loginPassword">Password</label>
            <input type="password" id="loginPassword" class="form-input" placeholder="Enter your password" required autocomplete="current-password" minlength="8">
          </div>
          <div class="auth-form-row">
            <label class="auth-checkbox-label" for="rememberMe">
              <input type="checkbox" id="rememberMe"> Remember me
            </label>
            <a href="forgot-password.html" class="auth-forgot-link">Forgot password?</a>
          </div>
          <button type="submit" class="btn btn-primary btn-lg auth-submit-btn">Sign In</button>
        </form>

        <div class="auth-divider">OR</div>

        <div style="display:flex;gap:8px;">
          <button class="btn btn-secondary auth-social-btn" aria-label="Continue with Google">G</button>
          <button class="btn btn-secondary auth-social-btn" aria-label="Continue with Microsoft">M</button>
          <button class="btn btn-secondary auth-social-btn" aria-label="Continue with GitHub">GH</button>
        </div>

        <div class="auth-footer">
          Don't have an account? <a href="signup.html">Create one</a>
        </div>
      </div>
    </div>
  </div>

  <div id="toastContainer" class="toast-container" role="alert" aria-live="polite"></div>

  <script src="assets/js/utils.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      handleAuthSubmit('loginForm', 'dashboard.html');
    });
  </script>
</body>
</html>
