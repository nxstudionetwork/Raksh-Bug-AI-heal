<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create your RAKSH account">
  <title>Sign Up - RAKSH</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
</head>
<body>
  <a class="skip-link" href="#mainContent">Skip to main content</a>
  <div class="animated-bg">
    <div class="orb"></div>
    <div class="orb"></div>
    <div class="orb"></div>
  </div>

  <div class="signup-page" id="mainContent">
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-logo">
          <div class="logo-text">🛡️ RAKSH</div>
        </div>
        <h1 class="auth-title">Create Your Account</h1>
        <p class="auth-subtitle">Join thousands of users protected by AI-powered security</p>

        <div class="auth-avatar-upload">
          <div class="avatar-preview">
            <span>👤</span>
            <input type="file" accept="image/*" aria-label="Upload profile photo">
          </div>
          <span class="auth-avatar-hint">Add a profile photo (optional)</span>
        </div>

        <form id="signupForm">
          <div class="form-group">
            <label class="form-label" for="signupName">Full Name</label>
            <input type="text" id="signupName" class="form-input" placeholder="Your name" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="signupEmail">Email Address</label>
            <input type="email" id="signupEmail" class="form-input" placeholder="your@email.com" required autocomplete="email">
          </div>
          <div class="form-group">
            <label class="form-label" for="signupPassword">Password</label>
            <input type="password" id="signupPassword" class="form-input" placeholder="Create a strong password" required autocomplete="new-password" minlength="8">
            <div class="password-strength">
              <div class="strength-bar" id="signupStrength"></div>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="signupConfirm">Confirm Password</label>
            <input type="password" id="signupConfirm" class="form-input" placeholder="Confirm your password" required autocomplete="new-password">
          </div>
          <label class="auth-terms-label">
            <input type="checkbox" required>
            I agree to the <a href="help.html" class="auth-terms-link">Terms of Service</a> and <a href="help.html" class="auth-terms-link">Privacy Policy</a>
          </label>
          <button type="submit" class="btn btn-primary btn-lg auth-submit-btn">Create Account</button>
        </form>

        <div class="auth-footer">
          Already have an account? <a href="login.html">Sign in</a>
        </div>
      </div>
    </div>
  </div>

  <div id="toastContainer" class="toast-container" role="alert" aria-live="polite"></div>

  <script src="assets/js/utils.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      handleAuthSubmit('signupForm', 'dashboard.html');
      initPasswordStrength('signupPassword', 'signupStrength');
    });
  </script>
</body>
</html>
