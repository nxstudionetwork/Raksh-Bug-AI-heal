<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Reset your RAKSH password">
  <title>Forgot Password - RAKSH</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
</head>
<body>
  <a class="skip-link" href="#mainContent">Skip to main content</a>
  <div class="animated-bg">
    <div class="orb"></div>
    <div class="orb"></div>
    <div class="orb"></div>
  </div>

  <div class="forgot-page" id="mainContent">
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-logo">
          <div class="logo-text">🛡️ RAKSH</div>
        </div>
        <h1 class="auth-title">Reset Password</h1>
        <p class="auth-subtitle">Enter your email and we'll send you a reset link</p>

        <form id="forgotForm">
          <div class="form-group">
            <label class="form-label" for="forgotEmail">Email Address</label>
            <input type="email" id="forgotEmail" class="form-input" placeholder="your@email.com" required autocomplete="email">
          </div>
          <button type="submit" class="btn btn-primary btn-lg auth-submit-btn">Send Reset Link</button>
        </form>

        <div class="auth-footer">
          Remember your password? <a href="login.html">Sign in</a>
        </div>
      </div>
    </div>
  </div>

  <div id="toastContainer" class="toast-container" role="alert" aria-live="polite"></div>

  <script src="assets/js/utils.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('forgotForm');
      if (form) {
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          const btn = form.querySelector('button[type="submit"]');
          btn.disabled = true;
          btn.textContent = 'Sending...';
          setTimeout(() => {
            UI.showToast('Reset link sent! Check your email.', 'success');
            btn.disabled = false;
            btn.textContent = 'Send Reset Link';
          }, 2000);
        });
      }
    });
  </script>
</body>
</html>
