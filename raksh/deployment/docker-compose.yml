version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: raksh
      POSTGRES_USER: raksh
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raksh"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: deployment/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://raksh:${DB_PASSWORD:-changeme}@postgres:5432/raksh
      DATABASE_SYNC_URL: postgresql://raksh:${DB_PASSWORD:-changeme}@postgres:5432/raksh
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-random-secret}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: 587
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      AI_CONFIDENCE_THRESHOLD: 0.5
      DEBUG: "false"
      LOG_LEVEL: INFO
      CORS_ORIGINS: http://localhost,http://localhost:80
      RATE_LIMIT_REQUESTS: 1000
      RATE_LIMIT_WINDOW: 60
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
      - ./frontend:/app/frontend:ro
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/app/frontend:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  postgres_data:
  uploads:
